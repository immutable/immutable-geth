name: PR

on:
  pull_request:

concurrency:
  group: PR-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Invariants
    runs-on: ubuntu-24-04-4-cores
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Invariants
        shell: bash
        run: ./.github/scripts/invariants.sh
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # pin@3.99.3

  bootstrap:
    name: Local E2E Tests
    runs-on: ubuntu-24-04-4-cores
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Cache modules
        uses: ./.github/actions/cache/golang
      - uses: ./.github/actions/bootstrap

  rewind:
    name: Rewind Chain Tests
    runs-on: ubuntu-24-04-4-cores
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Cache modules
        uses: ./.github/actions/cache/golang
      - uses: ./.github/actions/rewind

  lint:
    name: Lint
    runs-on: ubuntu-24-04-4-cores
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0 # We need the full history to get the base commit in order to compute the diff in golanci-lint
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version: 1.26.x
      - name: Cache modules
        uses: ./.github/actions/cache/golang
      - name: Cache linter
        uses: ./.github/actions/cache/golangci-lint
      - name: Debug golangci-lint cache
        run: |
          golangci-lint cache status
      - name: Lint
        shell: bash
        run: |
          golangci-lint run \
            --new-from-rev=${{ github.event.pull_request.base.sha || 'HEAD~'}} \
            --concurrency=4 \
            --config .golangci.yml \
            ./...

  tests:
    name: Unit Tests
    runs-on: ubuntu-24-04-4-cores
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version: 1.26.x
      - name: Cache modules
        uses: ./.github/actions/cache/golang
      - name: All Tests
        shell: bash
        run: |
          go run build/ci.go install
          go test $(go list ./... | grep -v 'go-ethereum/tests/immutable') -p 1 --parallel 4 -timeout=30m
