name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push:
    name: Push Docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Tags
        shell: bash
        run: |
          REPOSITORY_NAME="$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')"
          BUILD_TIMESTAMP="$(date +%s)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo TAGS="ghcr.io/${{ github.repository }}/immutable-geth:unstable-$BUILD_TIMESTAMP-git.$SHORT_SHA" >> $GITHUB_ENV

      - uses: ./.github/actions/push
        id: push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.TAGS }}

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # pin@v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}/immutable-geth
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
