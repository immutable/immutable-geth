name: Release

on:
  release:
    types: [published]

jobs:
  push:
    name: Push Docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set Release Tag
        run: echo "TAG=$(echo ${GITHUB_REF} | sed 's/refs\/tags\///')" >> $GITHUB_ENV

      - uses: ./.github/actions/push
        id: push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tags: "ghcr.io/${{ github.repository }}/immutable-geth:latest,ghcr.io/${{ github.repository }}/immutable-geth:${{ env.TAG }}"
          platforms: linux/amd64,linux/arm64

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # pin@v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}/immutable-geth
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
