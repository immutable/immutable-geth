---
name: "Test local bootstrap"

runs:
  using: composite
  steps:
    - name: Setup
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
      with:
        go-version: 1.26.x

    - name: Build
      shell: bash
      run: |
        make geth
        go run build/ci.go install -static ./cmd/bootnode

    - name: Test
      shell: bash
      run: ./.github/scripts/bootstrap_test.sh
